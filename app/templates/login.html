{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo/Header -->
        <div class="text-center mb-8 fade-in-up">
            <div class="w-16 h-16 bg-primary-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-primary-500/30">
                <i class="fa-solid fa-graduation-cap text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-display font-bold text-white mb-2">Socrates AI</h1>
            <p class="text-slate-400">Seu tutor particular e inteligente.</p>
        </div>

        <!-- Login Card -->
        <div class="glass-panel rounded-3xl p-8 fade-in-up" style="animation-delay: 0.1s;">
            <div class="text-center">
                <i class="fa-solid fa-link text-4xl text-primary-500 mb-4"></i>
                <h2 class="text-xl font-medium text-white mb-2">Acesso Restrito</h2>
                <p class="text-slate-400 text-sm mb-6">Para acessar sua atividade, por favor utilize o <strong>link direto</strong> fornecido pelo seu professor.</p>
            </div>
            
            <div class="mt-6 text-center">
                <a href="/admin/login" class="text-sm text-slate-500 hover:text-primary-400 transition-colors">Acesso do Professor</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
