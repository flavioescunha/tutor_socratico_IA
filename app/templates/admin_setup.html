{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8 fade-in-up">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-rocket text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-display font-bold text-white mb-2">Primeiro Acesso</h1>
            <p class="text-sm text-slate-400">Crie o usuário administrador inicial do sistema.</p>
        </div>

        <div class="glass-panel rounded-3xl p-8 fade-in-up" style="animation-delay: 0.1s;">
            <form action="/api/admin/register" method="POST" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-300 mb-2">Seu Nome de Usuário</label>
                    <input type="text" name="username" id="username" required placeholder="ex: flavio"
                        class="block w-full px-4 py-3 bg-dark-800/50 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Crie uma Senha</label>
                    <input type="password" name="password" id="password" required
                        class="block w-full px-4 py-3 bg-dark-800/50 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
                
                <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/20 transition-all active:scale-[0.98] mt-4 flex justify-center items-center">
                    Criar Conta Administrador <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
