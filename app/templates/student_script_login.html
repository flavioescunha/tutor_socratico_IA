{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-6" style="background: radial-gradient(circle at top right, #1e1b4b, #09090b);">
    <div class="max-w-md w-full glass-panel rounded-3xl p-8 shadow-2xl shadow-indigo-900/20 fade-in-up border border-slate-700/50 relative overflow-hidden">
        
        <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500/10 rounded-full blur-3xl -mr-16 -mt-16"></div>
        <div class="absolute bottom-0 left-0 w-32 h-32 bg-purple-500/10 rounded-full blur-3xl -ml-16 -mb-16"></div>

        <div class="text-center mb-8 relative z-10">
            <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-purple-600 rounded-2xl mx-auto flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/30 transform rotate-3">
                <i class="fa-solid fa-graduation-cap text-3xl text-white -rotate-3"></i>
            </div>
            <h1 class="text-2xl font-display font-bold text-white mb-2">{{ script.title }}</h1>
            <p class="text-sm text-slate-400">{{ script.subject }} {{ (' - ' ~ script.target_audience) if script.target_audience else '' }}</p>
        </div>

        {% if error_msg %}
        <div class="bg-red-500/10 border border-red-500/50 rounded-xl p-4 mb-6 flex items-start space-x-3 text-red-400 relative z-10">
            <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
            <p class="text-sm">{{ error_msg }}</p>
        </div>
        {% endif %}

        <form action="/api/roteiro/{{ script.id }}/login" method="POST" class="space-y-5 relative z-10">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Nome Completo</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-regular fa-user text-slate-500"></i>
                    </div>
                    <input type="text" name="nome" required placeholder="Digite seu nome"
                        class="block w-full pl-10 pr-4 py-3 bg-dark-900/80 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm placeholder-slate-600">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Nº da Chamada</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-list-ol text-slate-500"></i>
                        </div>
                        <input type="number" name="numero" required placeholder="Ex: 15" min="1"
                            class="block w-full pl-10 pr-4 py-3 bg-dark-900/80 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm placeholder-slate-600">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">RM (Senha)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-id-card text-slate-500"></i>
                        </div>
                        <input type="password" name="rm" required placeholder="Seu RM"
                            class="block w-full pl-10 pr-4 py-3 bg-dark-900/80 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm placeholder-slate-600">
                    </div>
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-600/25 transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center mt-6">
                Iniciar Atividade
                <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-xs text-slate-500">Tutor Socrático Inteligente</p>
        </div>
    </div>
</div>
{% endblock %}
